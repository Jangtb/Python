# Publica la app en GitHub Pages (HTTPS, necesario para el GPS del celular).
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: Publicar Explora Chile

on:
  push:
    branches: [master]
    paths: ["explora-chile/web/**", ".github/workflows/publicar-explora-chile.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar datos
        run: python3 explora-chile/tools/validar_datos.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explora-chile/web
      - id: despliegue
        uses: actions/deploy-pages@v4
